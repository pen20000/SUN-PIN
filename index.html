<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUN-PIN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f9fafb;
      line-height: 1.6;
    }
    header {
      padding: 20px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 700;
      font-size: 20px;
    }
    main { max-width: 800px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 40px; margin-bottom: 16px; }
    p.lead { font-size: 18px; color: #4b5563; margin-bottom: 40px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
    .card h2 { font-size: 18px; margin-bottom: 8px; }
    .card p { color: #6b7280; font-size: 14px; }
    footer { text-align: center; padding: 32px; color: #9ca3af; font-size: 14px; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <header>SUN-PIN</header>
  <main>
    <h1>你好，世界</h1>
    <p class="lead">这是 SUN-PIN 仓库的第一个网页。简单、干净，随时可以改造。</p>
    <div class="cards">
      <div class="card"><h2>简单</h2><p>纯 HTML 与 CSS，零依赖，双击即可打开。</p></div>
      <div class="card"><h2>快速</h2><p>一个文件就是一个页面，加载无需等待。</p></div>
      <div class="card"><h2>开放</h2><p>代码托管在 GitHub，任何人都能查看和改进。</p></div>
    </div>
  </main>
  <footer>© 2026 SUN-PIN</footer>
</body>
</html>
